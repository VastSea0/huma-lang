[package]
name = "huma-lsp"
version = "0.6.0"
edition = "2021"
license = "MIT"
description = "Language Server Protocol (LSP) server for the Hüma programming language."

[[bin]]
name = "huma-lsp"
path = "src/main.rs"

[dependencies]
huma-core = { path = "../huma-core" }
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
tower-lsp = "0.20"
walkdir = "2"
regex = "1"
serde_json = "1"
