[package]
name = "huma-cli"
version = "0.5.2"
description = "Unified CLI entry point for the Hüma programming language — build, run, REPL, update."
authors = ["VastSea0 <vastseaoffical0@outlook.com>"]
license = "MIT"
edition = "2021"
default-run = "huma"

[[bin]]
name = "huma"
path = "src/main.rs"

[features]
# Keep default CLI lean (avoid pulling Tauri IDE into builds).
default = []
ide = ["dep:app"]

[dependencies]
huma-core = { path = "../huma-core" }
huma-compiler = { path = "../huma-compiler" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
self_update = { version = "0.41", features = ["archive-tar", "archive-zip", "compression-flate2"] }
app = { path = "../../src-tauri", optional = true }
indicatif = "0.17"
colored = "2"
ureq = "2.9"
semver = "1.0"
chrono = "0.4"
sha2 = "0.10"
hex = "0.4"

