[package]
name = "huma-cli"
version = "0.6.0"
description = "Unified CLI entry point for the Hüma programming language — build, run, test, and REPL."
authors = ["VastSea0 <vastseaoffical0@outlook.com>"]
license = "MIT"
edition = "2021"
rust-version = "1.94.1"
default-run = "huma"

[[bin]]
name = "huma"
path = "src/main.rs"

[features]
default = []

[dependencies]
huma-core = { path = "../huma-core" }
huma-compiler = { path = "../huma-compiler" }
huma-hmi = { path = "../huma-hmi" }
huma-stdlib-ai = { path = "../huma-stdlib-ai" }
huma-stdlib-file = { path = "../huma-stdlib-file" }
huma-stdlib-native = { path = "../huma-stdlib-native" }
huma-stdlib-net = { path = "../huma-stdlib-net" }
huma-stdlib-process = { path = "../huma-stdlib-process" }
huma-stdlib-sqlite = { path = "../huma-stdlib-sqlite" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2"
semver = "1.0"
chrono = "0.4"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = "3.0.0"
unicode-normalization = "0.1"
wait-timeout = "0.2"
shell-words = "1.1"
