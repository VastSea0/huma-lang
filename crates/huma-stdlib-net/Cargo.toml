[package]
name = "huma-stdlib-net"
version = "0.6.0"
description = "Optional HTTP client and server adapter for Hüma."
authors = ["VastSea0 <vastseaoffical0@outlook.com>"]
license = "MIT"
edition = "2021"
rust-version = "1.94.1"

[dependencies]
huma-runtime = { path = "../huma-runtime" }
huma-vm = { path = "../huma-vm" }
futures-util = "0.3"
hyper = { version = "0.14", features = ["full"] }
once_cell = "1.19"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
