[package]
name = "huma-core"
version = "0.5.2"
description = "Core language primitives for Hüma: tokens, AST, lexer, parser, values, bytecode, VM, and interpreter."
authors = ["VastSea0 <vastseaoffical0@outlook.com>"]
license = "MIT"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
thiserror = "2"
eframe = "0.27"
once_cell = "1.19"
ureq = "2"
tiny_http = "0.12"
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
hyper = { version = "0.14", features = ["full"] }
bytes = "1"
futures-util = "0.3"
regex = "1"
rand = { version = "0.8", features = ["small_rng"] }
unicode-normalization = "0.1"


