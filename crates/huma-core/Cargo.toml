[package]
name = "huma-core"
version = "0.6.0"
description = "Core language primitives for Hüma: tokens, AST, lexer, parser, values, bytecode, VM, and interpreter."
authors = ["VastSea0 <vastseaoffical0@outlook.com>"]
license = "MIT"
edition = "2021"
rust-version = "1.94.1"

[dependencies]
huma-syntax = { path = "../huma-syntax" }
huma-bytecode = { path = "../huma-bytecode" }
huma-hmi = { path = "../huma-hmi" }
huma-stdlib = { path = "../huma-stdlib" }
huma-stdlib-ai = { path = "../huma-stdlib-ai" }
huma-stdlib-file = { path = "../huma-stdlib-file" }
huma-runtime = { path = "../huma-runtime" }
huma-stdlib-native = { path = "../huma-stdlib-native" }
huma-stdlib-net = { path = "../huma-stdlib-net" }
huma-stdlib-process = { path = "../huma-stdlib-process" }
huma-stdlib-sqlite = { path = "../huma-stdlib-sqlite" }
huma-vm = { path = "../huma-vm" }
huma-compiler = { path = "../huma-compiler" }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"

[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "runtime"
harness = false
test = false

[[test]]
name = "integration_tests"
path = "../../tests/integration_tests.rs"

[[test]]
name = "module_tests"
path = "../../tests/module_tests.rs"

[[test]]
name = "source_corpus_tests"
path = "../../tests/source_corpus_tests.rs"
