[package]
name = "huma-core"
version = "0.6.0"
description = "Core language primitives for Hüma: tokens, AST, lexer, parser, values, bytecode, VM, and interpreter."
authors = ["VastSea0 <vastseaoffical0@outlook.com>"]
license = "MIT"
edition = "2021"
rust-version = "1.92"

[dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
thiserror = "2"
eframe = { version = "0.35", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
once_cell = "1.19"
ureq = "2"
tiny_http = "0.12"
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
hyper = { version = "0.14", features = ["full"] }
bytes = "1"
csv = "1.3"
futures-util = "0.3"
regex = "1"
rand = { version = "0.8", features = ["small_rng"] }
unicode-normalization = "0.1"
libloading = "0.8"
wait-timeout = "0.2"

[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "runtime"
harness = false
test = false

[[test]]
name = "integration_tests"
path = "../../tests/integration_tests.rs"

[[test]]
name = "module_tests"
path = "../../tests/module_tests.rs"

[[test]]
name = "source_corpus_tests"
path = "../../tests/source_corpus_tests.rs"
