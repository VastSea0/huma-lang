[package]
name = "huma-compiler"
version = "0.6.0"
description = "Hüma versioned bytecode compiler and validated Cranelift AOT utilities."
authors = ["VastSea0 <vastseaoffical0@outlook.com>"]
license = "MIT"
edition = "2021"
rust-version = "1.92"

[dependencies]
huma-core    = { path = "../huma-core" }
serde        = { version = "1.0", features = ["derive"] }
serde_json   = "1.0"
thiserror    = "2"
sha2         = "0.10"

# ── Cranelift AOT (Faz 1: sayısal alt küme) ─────────────────────────────────
cranelift-codegen  = { version = "0.119", default-features = false, features = ["host-arch"] }
cranelift-frontend = "0.119"
cranelift-module   = "0.119"
cranelift-object   = "0.119"
target-lexicon     = "0.13"
tempfile           = "3"
wait-timeout       = "0.2"
