[package]
name = "huma-runtime"
version = "0.6.0"
description = "Normative Hüma interpreter, value model, limits, and host capability boundary."
authors = ["VastSea0 <vastseaoffical0@outlook.com>"]
license = "MIT"
edition = "2021"
rust-version = "1.94.1"

[dependencies]
huma-syntax = { path = "../huma-syntax" }
huma-bytecode = { path = "../huma-bytecode" }
huma-stdlib = { path = "../huma-stdlib" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
regex = "1"
rand = { version = "0.8", features = ["small_rng"] }
unicode-normalization = "0.1"
thiserror = "2"
