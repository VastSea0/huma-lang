[package]
name = "huma-perf"
version = "0.6.0"
description = "Dedicated-runner performance measurement and regression gate for Hüma."
authors = ["VastSea0 <vastseaoffical0@outlook.com>"]
license = "MIT"
edition = "2021"
rust-version = "1.94.1"
publish = false

[dependencies]
huma-compiler = { path = "../huma-compiler" }
huma-runtime = { path = "../huma-runtime" }
huma-syntax = { path = "../huma-syntax" }
huma-vm = { path = "../huma-vm" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
