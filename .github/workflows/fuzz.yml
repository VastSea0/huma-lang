name: Scheduled fuzzing

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [lexer_parser, hmi_frame, bytecode_verifier]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned Rust nightly
        uses: dtolnay/rust-toolchain@4fd1da8b0805d2d2e936788875a7d65dbd677dc2 # nightly action
        with:
          toolchain: nightly-2026-07-26

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@82fc405565b9cf90abfe700ba43b4751ce2fe422 # cargo-fuzz
        with:
          tool: cargo-fuzz@0.13.2

      # cargo-fuzz `--locked` kabul etmez; kilit tazeliği ayrıca denetlenir.
      - name: Verify fuzz lock file
        run: cargo metadata --locked --format-version 1 --manifest-path fuzz/Cargo.toml > /dev/null

      - name: Fuzz ${{ matrix.target }}
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=300 -max_len=65536
