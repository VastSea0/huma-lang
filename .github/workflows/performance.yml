name: Performance Gate

on:
  pull_request:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Baseline git ref
        required: false
        default: main

permissions:
  contents: read

jobs:
  compare:
    # Sonuçların karşılaştırılabilir olması için sabit donanım/OS etiketi.
    runs-on: [self-hosted, huma-perf]
    timeout-minutes: 30
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: candidate

      - name: Checkout baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha || inputs.baseline_ref || 'main' }}
          path: baseline

      - name: Measure and compare
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d baseline/crates/huma-perf ]]; then
            echo "Baseline henüz huma-perf içermiyor; ilk kurulum karşılaştırması atlandı."
            exit 0
          fi
          cargo run --release --locked --manifest-path baseline/Cargo.toml -p huma-perf -- measure "$RUNNER_TEMP/huma-baseline.json"
          cargo run --release --locked --manifest-path candidate/Cargo.toml -p huma-perf -- measure "$RUNNER_TEMP/huma-candidate.json"
          cargo run --release --locked --manifest-path candidate/Cargo.toml -p huma-perf -- check "$RUNNER_TEMP/huma-baseline.json" "$RUNNER_TEMP/huma-candidate.json"
