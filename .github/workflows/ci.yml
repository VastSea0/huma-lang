name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  security-audit:
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit Rust dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  rust-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Reject Rust warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

  platform-check:
    name: Stable compile (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: swatinem/rust-cache@v2

      - name: Check every Rust target
        run: cargo check --workspace --all-targets

  tests:
    runs-on: ubuntu-latest
    needs: rust-quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: swatinem/rust-cache@v2

      - name: Run workspace tests
        run: cargo test --workspace --all-targets

      - name: Run canonical Hüma test suite
        run: cargo run -p huma-cli -- test tests

      - name: Run Hüma example smoke tests
        run: cargo run -p huma-cli -- test examples

      - name: Build release CLI
        run: cargo build --release -p huma-cli

  website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: www/site/package-lock.json

      - name: Install website dependencies
        working-directory: www/site
        run: npm ci

      - name: Audit website dependencies
        working-directory: www/site
        run: npm audit

      - name: Lint website
        working-directory: www/site
        run: npm run lint

      - name: Build website
        working-directory: www/site
        run: npm run build
