name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e43eeffd51aefeea929f4ea14e09fd077153e788 # 1.94.1

      # rustsec/audit-check cargo-audit'i `--locked` olmadan derliyordu;
      # güncel bağımlılıkları pinli 1.94.1 araç zincirini desteklemediği için
      # iş denetim yapamadan düşüyordu. Sürüm ve kilit dosyası sabitlenir.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Audit Rust dependencies
        run: cargo audit

  rust-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e43eeffd51aefeea929f4ea14e09fd077153e788 # 1.94.1
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Reject Rust warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  platform-check:
    name: Stable compile (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e43eeffd51aefeea929f4ea14e09fd077153e788 # 1.94.1

      - name: Cache cargo artifacts
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Check every Rust target
        run: cargo check --workspace --all-targets --locked

  tests:
    runs-on: ubuntu-latest
    needs: rust-quality
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e43eeffd51aefeea929f4ea14e09fd077153e788 # 1.94.1

      - name: Cache cargo artifacts
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Run workspace tests
        run: cargo test --workspace --all-targets --locked

      - name: Run canonical Hüma test suite
        run: cargo run --locked -p huma-cli -- test tests

      - name: Install example package dependencies
        shell: bash
        # Örnek paketler kaynak ağacındaki birinci taraf paketlere bağlıdır;
        # testleri kendi paket kökünde kurulu bağımlılıklarla çalışır.
        run: |
          set -euo pipefail
          cargo build --locked -p huma-cli
          for manifest in examples/*/huma.json; do
            (cd "$(dirname "$manifest")" && "$GITHUB_WORKSPACE/target/debug/huma" kur --güvenilir)
          done

      - name: Run Hüma example smoke tests
        run: cargo run --locked -p huma-cli -- test examples

      - name: Build release CLI
        run: cargo build --release --locked -p huma-cli
