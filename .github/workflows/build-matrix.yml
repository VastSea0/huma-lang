name: Multi-Architecture Cross-Compilation Build

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  build-matrix:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux Targets ──────────────────────────────────────────
          - platform: 'ubuntu-latest'
            target: 'x86_64-unknown-linux-gnu'
            artifact: 'huma-x86_64-unknown-linux-gnu.tar.gz'
            use_cross: false
          - platform: 'ubuntu-latest'
            target: 'x86_64-unknown-linux-musl'
            artifact: 'huma-x86_64-unknown-linux-musl.tar.gz'
            use_cross: true
          - platform: 'ubuntu-latest'
            target: 'aarch64-unknown-linux-gnu'
            artifact: 'huma-aarch64-unknown-linux-gnu.tar.gz'
            use_cross: true
          - platform: 'ubuntu-latest'
            target: 'aarch64-unknown-linux-musl'
            artifact: 'huma-aarch64-unknown-linux-musl.tar.gz'
            use_cross: true
          - platform: 'ubuntu-latest'
            target: 'armv7-unknown-linux-gnueabihf'
            artifact: 'huma-armv7-unknown-linux-gnueabihf.tar.gz'
            use_cross: true
          - platform: 'ubuntu-latest'
            target: 'riscv64gc-unknown-linux-gnu'
            artifact: 'huma-riscv64gc-unknown-linux-gnu.tar.gz'
            use_cross: true

          # ── macOS Targets ──────────────────────────────────────────
          - platform: 'macos-latest'
            target: 'x86_64-apple-darwin'
            artifact: 'huma-x86_64-apple-darwin.tar.gz'
            use_cross: false
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            artifact: 'huma-aarch64-apple-darwin.tar.gz'
            use_cross: false

          # ── Windows Targets ────────────────────────────────────────
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            artifact: 'huma-x86_64-pc-windows-msvc.zip'
            use_cross: false
          - platform: 'windows-latest'
            target: 'i686-pc-windows-msvc'
            artifact: 'huma-i686-pc-windows-msvc.zip'
            use_cross: false
          - platform: 'windows-latest'
            target: 'aarch64-pc-windows-msvc'
            artifact: 'huma-aarch64-pc-windows-msvc.zip'
            use_cross: false

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross (for Cross-Compilation targets)
        if: matrix.use_cross
        uses: taiki-e/install-action@cross

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build CLI Binary (Native Cargo)
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --package huma-cli --target ${{ matrix.target }}

      - name: Build CLI Binary (Cross Container)
        if: matrix.use_cross
        run: cross build --release --package huma-cli --target ${{ matrix.target }}

      - name: Package Binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.artifact }} huma
          cd ../../..

      - name: Package Binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/huma.exe" -DestinationPath "${{ matrix.artifact }}"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.artifact }}
